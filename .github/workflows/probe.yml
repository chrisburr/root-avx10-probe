name: probe

# GitHub's runner pool is mixed, so the only way to reach the affected CPU is to
# take many samples and record what each one landed on. Each sample runs the
# same check twice on the same machine - once against the LCG view from CVMFS,
# once against conda-forge's root_base - so a hit on one and not the other would
# point at the build rather than at LLVM.
on:
  workflow_dispatch:
    inputs:
      samples:
        description: "How many runners to sample"
        default: "40"
      lcg_view:
        description: "LCG view to source"
        default: "/cvmfs/sft.cern.ch/lcg/views/LCG_110a/x86_64-el9-gcc15-opt/setup.sh"
  schedule:
    # the pool changes over time; a weekly sample shows whether it still bites
    - cron: "17 6 * * 1"

permissions:
  contents: read

env:
  LCG_VIEW: ${{ inputs.lcg_view || '/cvmfs/sft.cern.ch/lcg/views/LCG_110a/x86_64-el9-gcc15-opt/setup.sh' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - id: gen
        run: |
          n="${{ inputs.samples || '40' }}"
          echo "matrix=$(seq 1 "$n" | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  probe:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        sample: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          run-install: false

      - name: Identify the CPU
        id: cpu
        run: |
          model=$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | xargs)
          # the kernel does not always advertise avx10 even where the CPU has
          # it, so record the raw evidence rather than trusting a single flag
          avx10=$(grep -oE 'avx10[^ ]*' /proc/cpuinfo | sort -u | paste -sd, -)
          avx512=$(grep -m1 -oE 'avx512f' /proc/cpuinfo || true)
          # archspec from conda-forge, so the label matches the one conda uses
          # in __archspec - the pip install of this silently failed before
          arch=$(pixi exec --spec archspec archspec cpu 2>/dev/null || echo unknown)
          {
            echo "model=${model}"
            echo "avx10=${avx10:-none}"
            echo "avx512=${avx512:-none}"
            echo "arch=${arch}"
          } >> "$GITHUB_OUTPUT"
          echo "CPU: ${model} | archspec: ${arch} | avx10: ${avx10:-none} | avx512f: ${avx512:-none}"

      # --- conda-forge -------------------------------------------------------
      - name: Probe conda-forge root_base
        id: conda
        continue-on-error: true
        run: |
          pixi exec --spec root_base bash probe.sh conda-forge 2>&1 | tee /tmp/conda.txt || true
          echo "result=$(sed -n 's/^RESULT conda-forge //p' /tmp/conda.txt | tail -1)" >> "$GITHUB_OUTPUT"

      # --- LCG view from CVMFS ----------------------------------------------
      - uses: cvmfs-contrib/github-action-cvmfs@v5.6
        with:
          cvmfs_repositories: sft.cern.ch

      - name: Check the view is visible on the host
        run: |
          # touching it here triggers the automounter before the bind mount, and
          # tells us whether a later failure is CVMFS or the container
          test -e "$LCG_VIEW" && echo "view present on host" || { echo "view MISSING on host"; exit 1; }

      # The LCG view is built for EL9 and cannot run on the Ubuntu runner
      # directly. Two things are needed beyond a bare EL9 image:
      #
      #  - Bind mounting /cvmfs itself gives "Too many levels of symbolic links",
      #    because /cvmfs is an autofs mount and the automounter does not follow
      #    into the container's namespace. Mount the already-mounted repository
      #    directory instead.
      #  - LCG views expect HEP_OSlibs. Without it Cling has no system headers
      #    and dies on <assert.h> long before it would say anything about the
      #    CPU, which looks like a clean result but is not one.
      - name: Probe LCG view
        id: lcg
        continue-on-error: true
        run: |
          docker run --rm \
            -v /cvmfs/sft.cern.ch:/cvmfs/sft.cern.ch:ro \
            -v "$PWD:/work:ro" \
            -e LCG_VIEW="$LCG_VIEW" \
            almalinux:9 \
            bash -c '
              set -e
              # HEP_OSlibs pulls -devel packages that live in CRB, which ships
              # disabled on AlmaLinux, and a few that come from EPEL
              dnf install -y -q epel-release
              dnf install -y -q https://linuxsoft.cern.ch/wlcg/el9/x86_64/wlcg-repo-1.0.0-1.el9.noarch.rpm
              dnf install -y -q --enablerepo=crb HEP_OSlibs
              source "$LCG_VIEW"
              bash /work/probe.sh lcg
            ' 2>&1 | tee /tmp/lcg.txt || true
          echo "result=$(sed -n 's/^RESULT lcg //p' /tmp/lcg.txt | tail -1)" >> "$GITHUB_OUTPUT"

      - name: Record
        if: always()
        run: |
          printf '| %s | `%s` | %s | %s | %s | **%s** | **%s** |\n' \
            "${{ matrix.sample }}" \
            "${{ steps.cpu.outputs.arch }}" \
            "${{ steps.cpu.outputs.model }}" \
            "${{ steps.cpu.outputs.avx10 }}" \
            "${{ steps.cpu.outputs.avx512 }}" \
            "${{ steps.conda.outputs.result || 'did-not-run' }}" \
            "${{ steps.lcg.outputs.result || 'did-not-run' }}" \
            > row.md
          cat row.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: row-${{ matrix.sample }}
          path: row.md

  summary:
    needs: probe
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: row-*
          path: rows
      - name: Table
        run: |
          cat rows/*/row.md | sort -t'|' -k2 -n > all.md
          total=$(wc -l < all.md)
          count() { awk -F'|' -v c="$1" -v w="$2" '$c ~ w' all.md | wc -l; }
          {
            echo "## AVX10 warning probe"
            echo
            echo "| # | archspec | CPU | avx10 | avx512f | conda-forge | LCG |"
            echo "|---|---|---|---|---|---|---|"
            cat all.md
            echo
            echo "| | hit | clean | other-stderr | error | did-not-run |"
            echo "|---|---|---|---|---|---|"
            for col in 7:conda-forge 8:LCG; do
              c=${col%%:*}; name=${col#*:}
              echo "| ${name} | $(count "$c" '\*\*hit\*\*') | $(count "$c" '\*\*clean\*\*') | $(count "$c" other-stderr) | $(count "$c" '\*\*error\*\*') | $(count "$c" did-not-run) |"
            done
            echo
            echo "Total runners sampled: **${total}**"
          } >> "$GITHUB_STEP_SUMMARY"
